<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Productos — Series de Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 60px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #4CAF50, #81C784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: 900;
            color: #4CAF50;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 4px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }
        
        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            border-color: rgba(76, 175, 80, 0.5);
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(76, 175, 80, 0.05));
            transform: translateY(-8px);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .card-emoji {
            font-size: 2.5em;
        }
        
        .card-title {
            font-size: 1.4em;
            font-weight: 700;
        }
        
        .card-category {
            font-size: 0.85em;
            color: #a0a0a0;
            margin-bottom: 12px;
        }
        
        .card-meta {
            font-size: 0.9em;
            color: #808080;
            margin-bottom: 16px;
        }
        
        .card-meta div {
            margin-bottom: 4px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        
        .download-btn:active {
            transform: scale(0.98);
        }
        
        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #808080;
            font-size: 0.9em;
        }
        
        .badge {
            display: inline-block;
            background: rgba(76, 175, 80, 0.2);
            color: #81C784;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Happy & Healthy Pets</h1>
            <p class="subtitle">Serie de Videos Promocionales — 13 Productos</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">13</div>
                    <div class="stat-label">Videos</div>
                </div>
                <div class="stat">
                    <div class="stat-value">14s</div>
                    <div class="stat-label">Duración</div>
                </div>
                <div class="stat">
                    <div class="stat-value">9:16</div>
                    <div class="stat-label">Vertical</div>
                </div>
                <div class="stat">
                    <div class="stat-value">~20MB</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </header>
        
        <div class="grid">
            <!-- Videos generados dinámicamente -->
        </div>
        
        <footer>
            <p>✨ Videos generados con Remotion + GitHub Actions</p>
            <p>Renderizados en paralelo · Paletas personalizadas · Beneficios investigados</p>
        </footer>
    </div>
    
    <script>
        const videos = [
            { id: 'digest', name: 'Digest +', emoji: '🌿', category: 'Probióticos', size: 1.46 },
            { id: 'urinary', name: 'Urinary +', emoji: '💧', category: 'Salud Urinaria', size: 1.58 },
            { id: 'mobility', name: 'Mobility +', emoji: '🏃', category: 'Movilidad Articular', size: 1.73 },
            { id: 'artro', name: 'Artro +', emoji: '💪', category: 'Articulaciones', size: 1.67 },
            { id: 'vision', name: 'Vision +', emoji: '👁️', category: 'Salud Ocular', size: 1.49 },
            { id: 'alergy', name: 'Alergy +', emoji: '🌸', category: 'Piel & Alergias', size: 1.56 },
            { id: 'gymgo', name: 'Gymgo +', emoji: '🧠', category: 'Cognición', size: 1.6 },
            { id: 'bronqui', name: 'Bronqui +', emoji: '🫁', category: 'Respiratorio', size: 1.55 },
            { id: 'senior', name: 'Senior +', emoji: '🌟', category: 'Senior', size: 1.72 },
            { id: 'cartilag', name: 'Cartilag +', emoji: '🦴', category: 'Cartílago', size: 1.53 },
            { id: 'derma', name: 'Derma +', emoji: '✨', category: 'Piel & Pelaje', size: 1.7 },
            { id: 'lifequality', name: 'Life Quality +', emoji: '💎', category: 'Premium Senior', size: 1.59 },
            { id: 'calm', name: 'Calm +', emoji: '🌙', category: 'Ansiedad', size: 1.44 },
        ];
        
        const grid = document.querySelector('.grid');
        
        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-emoji">${video.emoji}</span>
                    <div>
                        <div class="card-title">${video.name}</div>
                        <span class="badge">${video.category}</span>
                    </div>
                </div>
                <div class="card-meta">
                    <div>⏱️ 14 segundos</div>
                    <div>📐 1080×1920 (9:16)</div>
                    <div>💾 ${video.size.toFixed(2)} MB</div>
                </div>
                <a href="/api/apps/69bcee79d908094d21d71ce3/files/mp/public/69bcee79d908094d21d71ce3/${video.id}_final.mp4" class="download-btn" download>
                    ⬇️ Descargar
                </a>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
