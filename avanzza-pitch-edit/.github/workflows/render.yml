name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create output directory
        run: mkdir -p out

      - name: Render video with Remotion
        run: |
          npx remotion render src/index.ts PitchVideo out/avanzza_pitch_final.mp4 \
            --codec=h264 \
            --crf=18 \
            --concurrency=2 \
            --timeout=1200

      - name: Check if video was created
        run: |
          if [ -f "out/avanzza_pitch_final.mp4" ]; then
            echo "✅ Video creado exitosamente"
            ls -lh out/avanzza_pitch_final.mp4
          else
            echo "❌ Error: no se generó el video"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 30
