name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create output directory
        run: mkdir -p out

      - name: Render video
        run: npx remotion render src/index.ts PitchVideo out/avanzza_pitch_final.mp4 --codec=h264 --jpeg-quality=95 --concurrency=4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 7

      - name: Get download URL
        run: echo "Video renderizado exitosamente ✅"
