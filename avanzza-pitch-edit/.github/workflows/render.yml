name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Create output directory
        run: mkdir -p out

      - name: Render video with Remotion
        run: |
          npx remotion render PitchVideo out/avanzza_pitch_final.mp4 \
            --codec=h264 \
            --crf=18 \
            --timeout=600

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          if [ -f "out/avanzza_pitch_final.mp4" ]; then
            echo "✅ Video renderizado exitosamente"
            ls -lh out/avanzza_pitch_final.mp4
          else
            echo "❌ El video no se generó"
          fi
