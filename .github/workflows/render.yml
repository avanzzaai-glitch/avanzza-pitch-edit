name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion globally
        run: npm install -g @remotion/cli

      - name: Create output directory
        run: mkdir -p out

      - name: Render video with Remotion
        run: |
          npx remotion render src/index.ts PitchVideo out/avanzza_pitch_final.mp4 \
            --codec=h264 \
            --fps=50 \
            --quality=95 \
            --browser-executable=/usr/bin/google-chrome
        timeout-minutes: 30

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 7

      - name: Log failure
        if: failure()
        run: echo "Render failed" && exit 1
