name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx remotion install

      - name: Create output directory
        run: mkdir -p out

      - name: Render video
        run: |
          npx remotion render src/index.ts PitchVideo out/avanzza_pitch_final.mp4 \
            --codec=h264 \
            --jpeg-quality=90 \
            --concurrency=4

      - name: Check output
        run: ls -lh out/

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: out/avanzza_pitch_final.mp4
          tag_name: render-${{ github.run_number }}
          body: |
            🎬 Avanzza Pitch Video — Renderizado exitoso
            - Duración: 63.2 segundos
            - Resolución: 464x832 (9:16)
            - Codec: H.264
            - Captions: 25 frases sincronizadas
            - Branding: Logo, watermark, lower thirds, CTA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
